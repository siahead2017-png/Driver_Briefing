<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Инструктаж водителя — печать</title>
<link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml">
<script>
  // См. index.html — document.write обходит агрессивное кэширование <link>
  // и всё равно блокирует парсер, поэтому страница не мигает без стилей.
  document.write('<link rel="stylesheet" href="assets/css/print.css?v=' + Date.now() + '">');
</script>
</head>
<body>

<nav class="toolbar" id="toolbar">
  <a href="index.html">← К инструктажу</a>
  <a href="print.html?doc=guide" id="tabGuide">Как вести</a>
  <a href="print.html?doc=script" id="tabScript">Сценарий ведущего</a>
  <a href="print.html?doc=cheat" id="tabCheat">Памятка водителя</a>
  <a href="print.html?doc=contacts" id="tabContacts">Контакты офиса</a>
  <button type="button" onclick="window.print()">Печать / PDF</button>
  <small class="toolbar__hint">В окне печати снимите «Заголовки и нижние колонтитулы» — иначе Chrome допечатает эту ссылку на бумагу</small>
</nav>

<div id="doc"><p style="padding:24px">Загружаю…</p></div>

<script>
  const printScript = document.createElement('script');
  printScript.type = 'module';
  printScript.src = 'assets/js/print.js?v=' + Date.now();
  document.body.appendChild(printScript);
</script>
</body>
</html>
